[device]
codename = "xuanyuan"
brand = "Xiaomi"
model = "Xiaomi 15 Ultra"
ab = true
soc = { hans = "骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite 行動平台", en = "Snapdragon® 8 Elite Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"
# The credential service, the secure element's HAL and the weaver reach the
# secure world through QSEECom and the element's node. On this phone those
# are root's, and the scripts' `system` makes every call come back as though
# the secure world had taken the credential and written no note; YARP runs
# them as root here too. Other phones keep the user their scripts name.
root_key_services = true

[display]
# The panel's own mode, persist.sys.miui_default_resolution in the odm
# partition's build.prop and the o1 panels' mode in the device tree:
# 1440 by 3200. persist.sys.miui_resolution gives the lower mode the system
# starts in, 1080 by 2400 at 450; the density is that one's, at the panel's
# own width, as the 13 Ultra's is.
width = 1440
height = 3200
density = 600
diagonal = 6.73

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: Synaptics TouchComm over SPI behind Xiaomi's touch layer.
# The secure element: ST's ST54L, whose stm_st54se_gpio makes the node the
# element's HAL opens, with stm_nfc_i2c beside it. The kernel driver hands
# those nodes out under its own thread, so the recovery waits for each one
# before it starts the programs that use them.
load = ["synaptics_tcm2", "stm_st54se_gpio", "stm_nfc_i2c"]

# The secure element's node is left as its driver makes it: root's. The
# credential service, the element's HAL and the weaver are run as root by
# `skyward-programs`, as YARP and the tested xuanyuan build run them, so no
# `[[owners]]` entry is needed to hand the node over. A hand-over that fails
# would stop the whole key start, which is worse than leaving a node root
# alone may open anyway.

# As on the 17 Ultra, no init script of the phone's starts touch_report: the
# touch feature service turns the controller's raw frames into touches with
# /odm/lib64/libtouchreport.so, and a recovery runs none of it. Told through
# Xiaomi's touch layer, the driver has the controller report positions
# itself.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]
# Two taps on the dark panel light it, as the phone's own system does. The
# controller keeps reporting fingers while the panel is off, so the taps
# arrive. This only says the panel *can*: the gesture is a switch on the
# settings page and ships off, because it costs the phone its suspend.
double_tap = true

# The modem partition holds the firmware the kernel's loader asks for — the
# ADSP's and the radios' — and is shown at /firmware for it. The secure
# element's HAL cannot open the TA until the DSP is running, and the weaver
# behind the lock screen's secret goes with it, so this sits on the
# decryption path and not only on the radios'.
[firmware]
partition = "modem"

[partitions]
mounted = ["persist"]

[logd]
libraries = ["/mnt/system/system/lib64/libsysutils.so", "/mnt/system/system/lib64/libcap.so"]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. Without it the
# CPUs stay at their highest clock and voltage even while idle, and the phone
# slowly heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# The key chain itself is not listed here. Skyward 0.3.1 reads the installed
# system's own init scripts and VINTF descriptions and starts qseecomd,
# ssgtzd, hlosminkdaemon, keymint, gatekeeper, secure_element, weaver and the
# boot control in the order the phone's own init does. That is also what
# keeps a second weaver description out of the recovery's manifest: the
# installed odm already describes it, and a duplicate makes servicemanager
# drop the whole manifest.

# WLAN: the peach node in the device tree, driven by qca_cld3_peach_v2, the
# one of the two Peach drivers this build loads. Its cfg80211 asks for
# rfkill, one of the kernel's own modules in system_dlkm. Its recovery covers
# the vendor partition's firmware folder with the modem's, as the 13 Ultra's
# does, so the settings and the MAC address are given to the loader again,
# under the names each driver asks for.
[wlan]
modules = ["rfkill", "qca_cld3_peach_v2"]
writes = [{ path = "/sys/bus/platform/devices/b0000000.qcom,cnss-peach/fs_ready", value = "1" }]
release = [{ path = "/sys/bus/platform/devices/b0000000.qcom,cnss-peach/fs_ready", value = "0" }]
firmware = [
    { name = "wlan/qca_cld/peach/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/peach/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/peach/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin" },
    { name = "wlan/qca_cld/peach_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/peach_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/peach_v2/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's OS4.0.4.0,
# whose full update package on the phone maker's own download server holds
# the recovery partition the recovery is built on top of. The hash is read
# from the package's own payload manifest.
[stock]
version = "OS4.0.4.0.XOACNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.4.0.XOACNXM/xuanyuan-ota_full-OS4.0.4.0.XOACNXM-user-17.0-a05ed5a444.zip"
recovery = "55f491052a360bc15362fd80c8bd2dd0912b289e1653f2bd7f9c5a12e7fea27b"

# qcom-hv-haptics (qcom,hv-haptics in its dtbo), whose driver says the
# motor's resonant frequency as the 17 Ultra's does; the click is made from
# samples at that frequency.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }
